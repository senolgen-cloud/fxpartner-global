name: Education posts

# ACTIVE since 2026-08-25: two lessons a day, first attempt 07:40 UTC.
#
# Released from "paused" after the compliance-brand review that gate exists
# for — see the route header for what it checked. Cadence was the owner's
# call: two, not the four originally asked for.
#
# 1. Volume. The blog is 28 hand-written posts in 35 days — 0.8 a day. Four a
#    day was five times that, and Google's spam guidance on scaled content
#    targets precisely the pattern of many pages produced quickly to win
#    rankings. Two sits close to the site's own pace.
#
# 2. The queue is finite on purpose. src/lib/educationTopics.ts now holds 77
#    subjects: about 19 days at four a day, 38 at two, 76 at one. When it
#    empties the run writes nothing rather than inventing filler, so a longer
#    schedule means adding subjects worth writing about, not loosening the
#    prompt.
#
# Three posts were generated from the real queue on 2026-08-25 without
# publishing, to see what this actually writes before deciding. All three
# passed the policy checks, ran 220-260 words, and stayed on process — no
# market call, no return figure. The sample is in the commit message.

on:
  workflow_dispatch:
  schedule:
    # FOUR ATTEMPTS, TWO LESSONS. A single daily slot has no second chance,
    # and GitHub's scheduled runs are best-effort: over the six days to
    # 2026-08-31 every run landed hours off this slot — 08:22, 18:24, 19:34,
    # 13:21, 13:17 — and the run for the 31st was dropped altogether, so a
    # day went by with no lesson. The hourly channel dispatcher never had
    # that problem, because a missed hour is retried an hour later.
    #
    # Publishing is capped per UTC day in the route (lessonsAllowedNow), so
    # the first attempt that lands writes the day's two lessons and the rest
    # cost one query and return "already published". Losing a whole day now
    # takes four consecutive drops instead of one.
    #
    # 07:40 stays the intended hour and is still clear of every other
    # content cron; the later three are catch-up.
    - cron: "40 7 * * *"
    - cron: "40 11 * * *"
    - cron: "40 15 * * *"
    - cron: "40 19 * * *"

jobs:
  # Owned by Haber & Editöryal Departmanı — see src/lib/departments.ts.
  education-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger education-posts
        run: |
          curl -sf -w "\nHTTP %{http_code}\n" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://fxpartner.global/api/cron/education-posts?count=2"
