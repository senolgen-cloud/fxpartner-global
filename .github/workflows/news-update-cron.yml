name: News bulletin cron

# Split out from telegram-cron.yml on 2026-08-17: that file also runs a
# */5-minute schedule (economic-calendar-alert), and GitHub Actions is
# documented to silently drop less-frequent schedule ticks in a workflow
# that also has a very-frequent one under load. Confirmed via `gh run
# list` that the news-update job had a 0/300 fire rate there, always
# "skipped" — this file gives the twice-daily bulletin its own
# uncontested schedule so it actually fires.
# Schedule removed 2026-08-27: the bulletin is now one of the sources in
# /api/cron/channel-dispatch's rotation, which paces every channel post to
# one per four hours. It kept its own twice-daily cron (09:15 / 18:15 Turkey
# time) until then. The split-file reasoning above still holds and is why
# the dispatcher also lives in a file of its own; this file stays for the
# manual run.
on:
  workflow_dispatch:

jobs:
  news-update:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger news-update
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://fxpartner.global/api/cron/news-update
