name: Telegram content cron

on:
  # Market snapshot chart (BTC/USD) is paused (workflow_dispatch only) —
  # requested to stop the recurring BTCUSD posts to Telegram.
  # News scan is paused (workflow_dispatch only) until DEEPL_API_KEY and
  # UPSTASH_REDIS_REST_URL/TOKEN are configured — without them
  # /api/cron/news-update 500s on every call.
  workflow_dispatch:

jobs:
  market-update:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger market-update
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://fxpartner.global/api/cron/market-update

  news-update:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger news-update
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://fxpartner.global/api/cron/news-update

  # Owned by Reklam & Kampanya Departmanı — see docs/ORGANIZATION.md.
  # Manual-only until Compliance & Brand signs off on a schedule.
  campaign-digest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger campaign-digest
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://fxpartner.global/api/cron/campaign-digest
