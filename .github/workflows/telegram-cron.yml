name: Telegram content cron

on:
  workflow_dispatch:
  schedule:
    # market-analysis-share (Piyasa Analizi): checks every 2h whether
    # today's /piyasa-analizi post is live; only actually sends once
    # per day thanks to the DB-backed dedup in telegram-posted-store.ts.
    - cron: "0 */2 * * *"
    # campaign-digest (Reklam & Kampanya): weekly roundup of active
    # broker campaigns + cashback rates, Monday mornings.
    - cron: "0 9 * * 1"
    # blog-share (Haber & Editöryal): one item per run from the shared
    # blog + Akademi backlog, oldest first. Twice a day, not every two
    # hours: at 12 runs a day the backlog of unshared posts would empty
    # into the channel in three days, which is the flood this cron was
    # written to avoid. Offset 30 minutes from market-analysis-share so
    # the two never fire together.
    - cron: "30 9,17 * * *"
    # economic-calendar-alert (Piyasa Analizi): checks every 5 min for
    # freshly-released medium/high-impact figures. Activated per owner
    # approval on 2026-08-07 — see src/lib/departments.ts.
    - cron: "*/5 * * * *"
    # news-update (Haber & Editöryal): moved to its own workflow file,
    # news-update-cron.yml, on 2026-08-17 — this file's */5-minute
    # schedule was silently starving news-update's twice-daily tick (see
    # that file's header comment for the full story).
    # broker-review-share (Broker İstihbaratı & İnceleme): top-5-brokers
    # digest, 4x/day at 09:00 / 13:00 / 17:00 / 23:00 Turkey time
    # (= 06:00 / 10:00 / 14:00 / 20:00 UTC). Was hourly (24 posts/day)
    # until 2026-08-14, briefly cut to weekly, then set to this owner-
    # requested 4x/day cadence.
    - cron: "0 6,10,14,20 * * *"

jobs:
  # Owned by Piyasa Analizi Departmanı — see docs/ORGANIZATION.md.
  # Paused again: only posts a BTC/USD chart (the one symbol with a
  # real free intraday data source, see src/lib/market-data.ts), which
  # made Telegram content look BTC-only. General coverage of EUR/USD,
  # XAU/USD, US100, oil etc. now goes through market-analysis-share
  # (real researched write-ups in src/data/marketAnalysis.ts) instead.
  market-update:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger market-update
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://fxpartner.global/api/cron/market-update

  # Owned by Piyasa Analizi Departmanı — see docs/ORGANIZATION.md.
  market-analysis-share:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger market-analysis-share
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://fxpartner.global/api/cron/market-analysis-share

  # Owned by Reklam & Kampanya Departmanı — see docs/ORGANIZATION.md.
  campaign-digest:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 1'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger campaign-digest
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://fxpartner.global/api/cron/campaign-digest

  # Owned by Haber & Editöryal Departmanı — see docs/ORGANIZATION.md.
  # Announces written content (Telegram + web push) from one queue holding
  # both /blog posts and FXPARTNER Akademi lessons, oldest first, one per
  # run — twice a day, so a backlog drains at a pace a channel can absorb.
  blog-share:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 9,17 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger blog-share
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://fxpartner.global/api/cron/blog-share

  # Owned by Piyasa Analizi Departmanı — see docs/ORGANIZATION.md.
  # Web-pushes real released figures (actual vs forecast/previous) for
  # medium/high-impact economic calendar events. Active as of 2026-08-07
  # per owner approval — see the automation governance note in
  # src/lib/departments.ts.
  economic-calendar-alert:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger economic-calendar-alert
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://fxpartner.global/api/cron/economic-calendar-alert

  # Owned by Broker İstihbaratı & İnceleme Departmanı — see docs/ORGANIZATION.md.
  broker-review-share:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6,10,14,20 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger broker-review-share
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://fxpartner.global/api/cron/broker-review-share
