name: Daily report

# ZAMANLAMA VERCEL'E TAŞINDI (26.09.2026) — bkz. vercel.json.
#
# Neden: iş akışı 25 Eylül 20:13 UTC'de main'e girdi, gönderim slotları
# 21:00 ve 21:30 UTC'ydi ve ikisinde de hiç çalışma olmadı. Aynı gece
# diğer zamanlanmış işler saatinde çalıştı (21:46, 22:30, 22:46), yani
# sorun yeni bir cron tanımının GitHub tarafında geç devreye girmesiydi.
# Depodaki eski not da aynı yöne işaret ediyor: buradaki */5 tanımlı bir iş
# ortalama 55 dakikada bir çalışmış, arada 226 dakikaya kadar boşluk olmuş.
# Raporun anlamı saatinde olmasında olduğu için zamanlama Vercel cron'una
# alındı; Vercel isteği doğrudan üretim dağıtımına, CRON_SECRET'i Bearer
# başlığıyla gönderiyor ve rota zaten tam olarak onu doğruluyor.
#
# Bu dosya elle tetikleme için duruyor: geçmiş bir günü yeniden yayınlamak
# ya da Vercel bir gece atlarsa aynı akşam telafi etmek için. Rota tarihe
# bağlı bir gönderim anahtarı tuttuğu için iki kanaldan da tetiklense aynı
# gün için ikinci mesaj çıkmaz.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Raporlanacak gün (YYYY-MM-DD). Boş bırakılırsa biten gün."
        required: false
        type: string

jobs:
  # Sosyal Medya & Topluluk Departmanı'na ait — src/lib/departments.ts.
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily-report
        run: |
          URL="https://fxpartner.global/api/cron/daily-report"
          if [ -n "${{ inputs.date }}" ]; then
            URL="$URL?date=${{ inputs.date }}"
          fi
          curl -sf -w "\nHTTP %{http_code}\n" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$URL"
