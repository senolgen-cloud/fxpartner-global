name: Active signals digest

# ACTIVE since 2026-08-24, every 3 hours, per explicit owner request.
# Owner approval stands in for the compliance-brand sign-off that
# src/lib/departments.ts requires before an automation leaves "paused".
#
# Every 3 hours rather than hourly, also the owner's call, and the safer
# read of this channel's history: broker-review-share ran hourly until
# 2026-08-14, flooded the channel, and had to be cut to 4x/day.
#
# Offset 20 minutes past the hour on purpose. On the hour, a */3 schedule
# collides with market-analysis-share (0 */2) at 00/06/12/18 and with
# broker-review-share (0 6,10,14,20) at 06:00 — three posts landing
# together. blog-share already sits 30 minutes off market-analysis-share
# for exactly this reason; :20 keeps this one clear of both.
#
# 8 slots a day, two of them overnight in Turkey (03:20 and 00:20 TRT).
# That is deliberate rather than an oversight: the route sends nothing when
# the board has not changed since its last post, so a quiet night produces
# no post at all instead of a 3am repeat.
#
# Its own workflow file rather than a job in telegram-cron.yml, because that
# file's workflow_dispatch fires every job it contains — see the header of
# broker-review-manual.yml for the same reasoning.

# Schedule removed 2026-08-27. The digest is now one of the sources in
# /api/cron/channel-dispatch's rotation, which paces every channel post to
# one per four hours per the owner's instruction. Left on its own 3-hourly
# cron it would have posted straight past that pace — the one thing the
# dispatcher exists to prevent.
#
# The collision-avoidance reasoning above is now handled for it: the
# dispatcher never lets two content posts land together, so no source needs
# to be offset from any other any more.
on:
  workflow_dispatch:

jobs:
  # Owned by Sosyal Medya & Topluluk Departmanı — see src/lib/departments.ts.
  active-signals-digest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger active-signals-digest
        run: |
          curl -sf -w "\nHTTP %{http_code}\n" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://fxpartner.global/api/cron/active-signals-digest"
